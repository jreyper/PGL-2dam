<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pokédex</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="contenedor">

    <header class="cabecera">
      <h1>Pokédex</h1>
    </header>

    <form id="formulario-busqueda" class="buscador">

      <label for="busqueda">
        Buscar Pokémon
      </label>

      <div class="buscador__controles">

        <input
          id="busqueda"
          name="busqueda"
          type="text"
          placeholder="Ejemplo: pikachu, 25 o char"
          autocomplete="off"
        >

        <button type="submit">
          Buscar
        </button>

      </div>

      <label for="filtro-tipo" class="filtro__label">
        Filtrar por tipo
      </label>

      <select id="filtro-tipo" class="filtro-tipo">
        <option value="">Todos los tipos</option>
      </select>

    </form>

    <p id="mensaje" class="mensaje" aria-live="polite">
      Preparando Pokédex...
    </p>

    <section
      id="resultado"
      class="resultado"
      aria-live="polite"
    ></section>

  </main>

  <script src="js/Pokemon.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
